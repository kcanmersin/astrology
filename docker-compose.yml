version: '3.8'

services:
  astrology-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astrology_fastapi_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      - DATABASE_URL=${DATABASE_URL}
    restart: unless-stopped
